name: flipru
description: "FlipRU — cevrimdisi Rusca-Turkce kelime ogrenme uygulamasi"

# Uygulama, pub.dev'e paket olarak yayinlanmiyor.
publish_to: 'none'

# Android'de versionName / versionCode olarak kullaniliyor.
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.3.2
  flutter_card_swiper: ^7.2.0
  shared_preferences: ^2.5.5
  flutter_tts: ^4.2.5
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  share_plus: ^13.3.0
  home_widget: ^0.9.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lint kurallari analysis_options.yaml icinde aciliyor.
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/words.json
    - assets/images/logo.png

  # Inter gömülü: uygulama tamamen çevrimdışı çalışsın ve Kiril + Türkçe
  # karakterler ile vurgu işareti (U+0301) her cihazda aynı görünsün.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
